name: CI/CD Pipeline

on:
  push:
    branches: "main"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/erp-tesseris-react:${{ github.sha }} .

      - name: Docker login
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Docker push
        run: docker push ${{ secrets.DOCKER_USERNAME }}/erp-tesseris-react:${{ github.sha }}

      - name: Set up Kubeconfig
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f my-k8s-app/final/react_deployment.yaml
          kubectl apply -f my-k8s-app/final/react_service.yaml 